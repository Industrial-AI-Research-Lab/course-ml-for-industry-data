[project]
name = "plant-assistant"
version = "0.1.0"
description = "Plant Engineer Assistant: demo project of the ML in Industry 2026 course"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==1.109.1",
    "pydantic==2.11.9",
    "python-dotenv==1.1.1",
    "pandas==2.3.2",
    "matplotlib==3.10.6",
    "tqdm==4.67.1",
    "tabulate==0.9.0",
    "socksio==1.0.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab==4.4.7",
    "ipykernel==6.30.1",
    "nbconvert==7.16.6",
    "ipywidgets==8.1.7",
]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
