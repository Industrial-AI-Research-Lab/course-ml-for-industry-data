[project]
name = "quality-assistant-practice"
version = "0.5.0"
description = "An interactive practice on tools, workflows and agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langchain==1.4.10",
  "langchain-core==1.7.7",
  "langgraph==1.2.20",
  "langchain-openai==1.7.4",
  "pandas==3.1.1",
  "ipywidgets==8.1.9",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
notebook = ["jupyterlab==4.4.7", "ipykernel==7.4.0", "nbconvert==7.17.2", "nbformat==5.11.1"]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
