[project]
name = "plant-assistant"
version = "0.4.0"
description = "Plant Engineer Assistant, practice 4: retrieval over plant documents, diagnose and fix"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==1.109.1",
    "pydantic==2.11.9",
    "python-dotenv==1.1.1",
    "pandas==2.3.2",
    "matplotlib==3.10.6",
    "tqdm==4.67.1",
    "tabulate==0.9.0",
    "socksio==1.0.0",
    "numpy>=2,<3",
    "pymupdf==2.0",
    "rank-bm25==0.2.2",
    "snowballstemmer==3.0.1",
]

[project.optional-dependencies]
# Only for regenerating the documents (scripts/generate_corpus.py).
generate = [
    "reportlab==5.0.1",
]
notebook = [
    "jupyterlab==4.4.7",
    "ipykernel==6.30.1",
    "nbconvert==7.16.6",
    "ipywidgets==8.1.7",
]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
