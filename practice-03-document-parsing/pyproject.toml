[project]
name = "plant-assistant"
version = "0.3.0"
description = "Plant Engineer Assistant, practice 3: reading industrial documents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==1.109.1",
    "pydantic==2.11.9",
    "python-dotenv==1.1.1",
    "pandas==2.3.2",
    "matplotlib==3.10.6",
    "tqdm==4.67.1",
    "tabulate==0.9.0",
    "socksio==1.0.0",
    "pymupdf==2.0",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "rapidfuzz==3.14.6",
    "pytesseract==0.3.13",
]

[project.optional-dependencies]
# Heavy parsers (PyTorch + model weights on first run). The notebook works without them: their outputs
# ship in data/parsed/. EasyOCR is both a reader and the OCR engine inside Docling.
parsers = [
    "docling==2.140.0",
    "easyocr==1.7.2",
]
# Only for regenerating the documents (scripts/generate_documents.py).
generate = [
    "reportlab==5.0.1",
]
notebook = [
    "jupyterlab==4.4.7",
    "ipykernel==6.30.1",
    "nbconvert==7.16.6",
    "ipywidgets==8.1.7",
]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
